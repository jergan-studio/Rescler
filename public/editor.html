<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rescler Editor</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1017;color:#eee;font:14px Arial}header{height:56px;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#171b25;border-bottom:1px solid #292f3d}header b{font-size:20px;margin-right:auto}button,input,textarea{background:#202633;color:#eee;border:1px solid #343c4d;border-radius:8px;padding:8px}button{cursor:pointer}.layout{display:grid;grid-template-columns:210px 1fr 300px;height:calc(100vh - 56px)}aside{padding:12px;border-right:1px solid #292f3d;overflow:auto}.center{display:grid;grid-template-rows:48px 1fr 1fr;min-width:0}.tabs{padding:8px;border-bottom:1px solid #292f3d}.work{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;min-height:0}.panel{background:#11151e;border:1px solid #292f3d;border-radius:10px;overflow:hidden}.panel h3{margin:0;padding:8px;background:#181d28;font-size:13px}textarea{width:100%;height:calc(100% - 34px);resize:none;border:0;border-radius:0;font:13px monospace;background:#0a0d13}.preview{display:flex;align-items:center;justify-content:center;background:#080a0e}.block{padding:10px;margin:7px 0;border-radius:8px;background:#252d3d;cursor:pointer}.sprite{padding:8px;border:1px dashed #3b4559;margin-top:8px}.sprite img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}.muted{color:#8992a3;font-size:12px}a{color:#9cc4ff}</style></head>
<body><header><b>🎮 Rescler</b><input id="name" value="My Rescler Game" style="width:180px"><button onclick="run()">▶ Run</button><button onclick="share()">🔗 Share</button><button onclick="location.href='index.html'">Home</button></header>
<div class="layout"><aside><h3>Blocks</h3><div class="block" onclick="addBlock('move')">➡ Move player</div><div class="block" onclick="addBlock('say')">💬 Say text</div><div class="block" onclick="addBlock('score')">⭐ Add score</div><div class="block" onclick="addBlock('wait')">⏱ Wait</div><h3>Sprites</h3><input type="file" accept="image/*" onchange="addSprite(this)"><div id="sprites"></div></aside>
<section class="center"><div class="tabs"><button onclick="mode('code')">HTML + JS</button><button onclick="mode('blocks')">Blocks</button><span id="status" class="muted"></span></div>
<div class="work" id="code"><div class="panel"><h3>HTML</h3><textarea id="html"><canvas id="game" width="640" height="360"></canvas></textarea></div><div class="panel"><h3>JavaScript</h3><textarea id="js">const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let x=300,y=160;
function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.fillRect(x,y,40,40);requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')x-=5;if(e.key==='ArrowRight')x+=5;if(e.key==='ArrowUp')y-=5;if(e.key==='ArrowDown')y+=5});
loop();</textarea></div></div>
<div class="work" id="blocks" style="display:none"><div class="panel"><h3>Blocks program</h3><div id="blockList" style="padding:10px"></div></div><div class="panel preview"><canvas id="blockPreview" width="640" height="360"></canvas></div></div>
<div class="panel preview" style="margin:0 10px 10px"><iframe id="frame" sandbox="allow-scripts" style="width:100%;height:100%;border:0;background:#fff"></iframe></div></section>
<aside><h3>Game</h3><p class="muted">Build with HTML + JavaScript or blocks. Sprites are included in the share link.</p><h3>Share</h3><div id="share" class="muted">Click Share to create a link. No database is used.</div></aside></div>
<script>
let blocks=[],sprites=[];const $=id=>document.getElementById(id);
function mode(m){$('code').style.display=m==='code'?'grid':'none';$('blocks').style.display=m==='blocks'?'grid':'none'}
function addBlock(type){blocks.push({type});renderBlocks();runBlocks()}
function renderBlocks(){$('blockList').innerHTML=blocks.map((b,i)=>`<div class="block">${b.type} <button onclick="blocks.splice(${i},1);renderBlocks();runBlocks()">×</button></div>`).join('')}
function addSprite(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{sprites.push({name:f.name,data:r.result});renderSprites()};r.readAsDataURL(f)}
function renderSprites(){$('sprites').innerHTML=sprites.map(s=>`<div class="sprite"><img src="${s.data}"><div>${s.name}</div></div>`).join('')}
function run(){const h=$('html').value,j=$('js').value.replace(/<\/script>/gi,'<\\/script>');$('frame').srcdoc=`<!doctype html><html><body>${h}<script>${j}<\/script></body></html>`;$('status').textContent=' Running code'}
function runBlocks(){const c=$('blockPreview'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#18202d';x.fillRect(0,0,c.width,c.height);let px=280,py=150,score=0;blocks.forEach(b=>{if(b.type==='move')px+=35;if(b.type==='score')score++;if(b.type==='say'){x.fillStyle='#fff';x.fillText('Hello!',px,py-15)}});x.fillStyle='#fff';x.fillRect(px,py,40,40);x.fillText('Score: '+score,15,25)}
function encode(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function share(){const data={name:$('name').value,html:$('html').value,js:$('js').value,blocks,sprites};const url=location.origin+location.pathname.replace(/editor\.html$/,'play.html')+'#'+encode(data);$('share').innerHTML=`<a href="${url}" target="_blank">${url}</a><br><button onclick="navigator.clipboard.writeText('${url}')">Copy link</button>`;$('status').textContent=' Share link created — no database'}
runBlocks();
</script></body></html>
