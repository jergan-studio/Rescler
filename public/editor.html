<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rescler Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1017;color:#eee;font:14px Arial}header{height:56px;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#171b25;border-bottom:1px solid #292f3d}header b{font-size:20px;margin-right:auto}button,select,input,textarea{background:#202633;color:#eee;border:1px solid #343c4d;border-radius:8px;padding:8px}button{cursor:pointer}.layout{display:grid;grid-template-columns:210px 1fr 300px;height:calc(100vh - 56px)}aside{padding:12px;border-right:1px solid #292f3d;overflow:auto}.center{display:grid;grid-template-rows:48px 1fr 1fr;min-width:0}.tabs{padding:8px;border-bottom:1px solid #292f3d}.work{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;min-height:0}.panel{background:#11151e;border:1px solid #292f3d;border-radius:10px;overflow:hidden}.panel h3{margin:0;padding:8px;background:#181d28;font-size:13px}textarea{width:100%;height:calc(100% - 34px);resize:none;border:0;border-radius:0;font:13px monospace;background:#0a0d13}.preview{display:flex;align-items:center;justify-content:center;background:#080a0e}.preview canvas{background:#202020;border:1px solid #444;max-width:95%;max-height:90%}.block{padding:10px;margin:7px 0;border-radius:8px;background:#252d3d;cursor:pointer}.sprite{padding:8px;border:1px dashed #3b4559;margin-top:8px}.sprite img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}.muted{color:#8992a3;font-size:12px}a{color:#9cc4ff}</style></head><body><header><b>🎮 Rescler</b><input id="name" value="My Rescler Game" style="width:180px"><button onclick="run()">▶ Run</button><button onclick="save()">☁ Save & Share</button><button onclick="location.href='/'">Home</button></header><div class="layout"><aside><h3>Blocks</h3><div class="block" onclick="addBlock('move')">➡ Move player</div><div class="block" onclick="addBlock('say')">💬 Say text</div><div class="block" onclick="addBlock('score')">⭐ Add score</div><div class="block" onclick="addBlock('wait')">⏱ Wait</div><h3>Sprites</h3><input type="file" accept="image/*" onchange="addSprite(this)"><div id="sprites"></div></aside><section class="center"><div class="tabs"><button onclick="mode('code')">HTML + JS</button><button onclick="mode('blocks')">Blocks</button><span id="status" class="muted"></span></div><div class="work" id="code"><div class="panel"><h3>HTML</h3><textarea id="html"><canvas id="game" width="640" height="360"></canvas></textarea></div><div class="panel"><h3>JavaScript</h3><textarea id="js">const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let x=300,y=160;
function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.fillRect(x,y,40,40);requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')x-=5;if(e.key==='ArrowRight')x+=5;if(e.key==='ArrowUp')y-=5;if(e.key==='ArrowDown')y+=5});
loop();</textarea></div></div><div class="work" id="blocks" style="display:none"><div class="panel"><h3>Blocks program</h3><div id="blockList" style="padding:10px"></div></div><div class="panel preview"><canvas id="blockPreview" width="640" height="360"></canvas></div></div><div class="panel preview" style="margin:0 10px 10px"><iframe id="frame" style="width:100%;height:100%;border:0;background:#fff"></iframe></div></section><aside><h3>Game</h3><p class="muted">Build with code or blocks. Sprites are stored with the project.</p><h3>Share</h3><div id="share" class="muted">Save the game to create a share link.</div></aside></div><script>
let blocks=[],sprites=[]; const $=id=>document.getElementById(id); function mode(m){$('code').style.display=m==='code'?'grid':'none';$('blocks').style.display=m==='blocks'?'grid':'none'}
function addBlock(type){blocks.push({type});renderBlocks()} function renderBlocks(){$('blockList').innerHTML=blocks.map((b,i)=>`<div class="block">${b.type} <button onclick="blocks.splice(${i},1);renderBlocks()">×</button></div>`).join('')}
function addSprite(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{sprites.push({name:f.name,data:r.result});$('sprites').innerHTML=sprites.map(s=>`<div class=sprite><img src="${s.data}"><div>${s.name}</div></div>`).join('')};r.readAsDataURL(f)}
function run(){let h=$('html').value,j=$('js').value; $('frame').srcdoc=`<!doctype html><html><body>${h}<script>${j.replace(/<\\\/script>/gi,'<\\\\/script>')}<\\/script></body></html>`;$('status').textContent=' Running'}
async function save(){const data={name:$('name').value,html:$('html').value,js:$('js').value,blocks,sprites};let id=location.pathname.split('/').pop();let r=await fetch(id&&id!=='editor.html'?'/api/games/'+id:'/api/games',{method:id&&id!=='editor.html'?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let d=await r.json();if(d.id){history.replaceState({},'',`/editor/${d.id}`);id=d.id} if(d.ok||d.id){const url=location.origin+'/play/'+id;$('share').innerHTML=`<a href="${url}" target="_blank">${url}</a><br><button onclick="navigator.clipboard.writeText('${url}')">Copy link</button>`;$('status').textContent=' Saved'}else $('status').textContent=d.error||'Save failed'}
async function load(){let id=location.pathname.split('/').pop();if(!id||id==='editor.html')return;let r=await fetch('/api/games/'+id);if(!r.ok)return;let d=await r.json();$('name').value=d.name;$('html').value=d.html;$('js').value=d.js;blocks=d.blocks||[];sprites=d.sprites||[];renderBlocks();$('sprites').innerHTML=sprites.map(s=>`<div class=sprite><img src="${s.data}"><div>${s.name}</div></div>`).join('');run()}load();
</script></body></html>
