<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play — Rescler</title><style>body{margin:0;background:#080a0e;color:#fff;font:14px Arial;display:grid;place-items:center;min-height:100vh}main{width:min(1000px,96vw)}h1{font-size:20px}iframe{width:100%;height:70vh;border:1px solid #333;border-radius:12px;background:#fff}a{color:#9cc4ff}</style></head><body><main><h1 id="title">Rescler Game</h1><iframe id="game" sandbox="allow-scripts"></iframe><br><br><a href="editor.html">Make your own game</a></main><script>
function decode(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function load(){const raw=location.hash.slice(1);if(!raw){document.getElementById('title').textContent='No game in this link';return}try{const d=decode(raw);document.title=d.name+' — Rescler';document.getElementById('title').textContent=d.name||'Rescler Game';const js=(d.js||'').replace(/<\/script>/gi,'<\\/script>');document.getElementById('game').srcdoc='<!doctype html><html><body>'+(d.html||'')+'<script>'+js+'<\/script></body></html>'}catch(e){document.body.innerHTML='<h2>Invalid Rescler game link</h2>'}}
load();
</script></body></html>
