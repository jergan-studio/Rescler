<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play — Rescler</title><style>body{margin:0;background:#080a0e;color:#fff;font:14px Arial;display:grid;place-items:center;min-height:100vh}main{width:min(1000px,96vw)}h1{font-size:20px}iframe{width:100%;height:70vh;border:1px solid #333;border-radius:12px;background:#fff}a{color:#9cc4ff}</style></head><body><main><h1 id="title">Rescler Game</h1><iframe id="game"></iframe><a href="/editor.html">Make your own game</a></main><script>async function load(){const id=location.pathname.split('/').pop();const r=await fetch('/api/games/'+id);if(!r.ok){document.body.innerHTML='<h2>Game not found</h2>';return}const d=await r.json();document.title=d.name+' — Rescler';document.getElementById('title').textContent=d.name;document.getElementById('game').srcdoc='<!doctype html><html><body>'+d.html+'<script>'+d.js.replace(/<\\\/script>/gi,'<\\\\/script>')+'<\\/script></body></html>'}load();</script></body></html>
